[project]
name = "driftscan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "numpy>=2.5.3",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[project.scripts]
driftscan = "driftscan.cli.main:app"
